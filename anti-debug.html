<!DOCTYPE html>
<html>
  <head>
    <title>反调试</title>
    <script>
      (function() {
        "use strict";
        
        // 修改惩罚机制：不再清空控制台，不再死循环，仅输出提示
        const Debugger_Checkfail = () => {
          console.log(`检测到Dev-tools`);
        };
        
        // 屏蔽快捷键和右键
        const blockShortcuts = () => {
          document.addEventListener("keydown", (e) => {
            if (e.key === "F12") {
              e.preventDefault();
              return false;
            }
            if (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) {
              e.preventDefault();
              return false;
            }
            if (e.ctrlKey && e.key.toUpperCase() === "U") {
              e.preventDefault();
              return false;
            }
          });
          document.addEventListener("contextmenu", (e) => e.preventDefault());
        };
        
        // 检查窗口大小差异
        const checkWindowSize = () => {
          const threshold = 160;
          const widthDiff = window.outerWidth - window.innerWidth > threshold;
          const heightDiff = window.outerHeight - window.innerHeight > threshold;
          if (widthDiff || heightDiff) {
            Debugger_Checkfail();
          }
        };
        
        // 检查时间差
        const checkTimeDiff = () => {
          const start = performance.now();
          (function test() {
            const end = performance.now();
            if (end - start > 100) {
              Debugger_Checkfail();
            }
          })();
        };
        
        // 无限 debugger
        const infiniteDebugger = () => {
          setInterval(() => {
            debugger;
          }, 50);
        };
        
        // 初始化反调试
        const initAntiDebug = () => {
          blockShortcuts();
          setInterval(checkWindowSize, 1000);
          setInterval(checkTimeDiff, 2000);
          infiniteDebugger();
        };
        
        initAntiDebug();
      })();
    </script>
  </head>
  <body>
    反调试测试中
  </body>
</html>
