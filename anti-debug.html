<!DOCTYPE html>
<html>
  <head>
    <title>反调试</title>
    <script>(function(){"use strict";const fryCPU=()=>{console.clear();console.log("%c检测到调试行为","color: red;font-size: 20px;");while(true){Math.sqrt(Math.random()*9999999)}};const blockShortcuts=()=>{document.addEventListener("keydown",(e)=>{if(e.key==="F12"){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key.toUpperCase())){e.preventDefault();return false}if(e.ctrlKey&&e.key.toUpperCase()==="U"){e.preventDefault();return false}});document.addEventListener("contextmenu",(e)=>e.preventDefault())};const checkWindowSize=()=>{const threshold=160;const widthDiff=window.outerWidth-window.innerWidth>threshold;const heightDiff=window.outerHeight-window.innerHeight>threshold;if(widthDiff||heightDiff){fryCPU()}};const checkTimeDiff=()=>{const start=performance.now();(function test(){const end=performance.now();if(end-start>100){fryCPU()}})()};const infiniteDebugger=()=>{setInterval(()=>{debugger},50)};const initAntiDebug=()=>{blockShortcuts();setInterval(checkWindowSize,1000);setInterval(checkTimeDiff,2000);infiniteDebugger()};initAntiDebug()})();</script>
  </head>
  <body>
    反调试测试中
  <body>
</html>
